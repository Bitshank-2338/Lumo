name: Bug report
description: Report a reproducible problem in Lumo
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I removed secrets, tokens, personal documents, and private data from this report.
          required: true
        - label: This is a reproducible bug, not a support request or feature proposal.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      description: Where did the problem occur?
      options:
        - Full local Lumo application
        - Public Lumo website or authenticated demo
        - Lumo skill
        - CLI or startup
        - Installation or build
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Clearly describe what went wrong.
      placeholder: What did you see?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Start Lumo with ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Lumo commit or version:
        - Operating system:
        - Python version:
        - Node.js version:
        - Browser:
        - Installation method:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and screenshots
      description: Paste relevant output or drag in screenshots. Remove credentials and private data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include frequency, workarounds, regression information, or related issues.
