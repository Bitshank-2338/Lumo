name: Question
description: Ask for help using or contributing to Lumo
title: "[Question]: "
labels: ["question"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the README and SUPPORT.md.
          required: true
        - label: I searched existing issues for an answer.
          required: true
        - label: I removed secrets and private data from this question.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Full local Lumo application
        - Public website or authenticated demo
        - Installation and configuration
        - Knowledge bases and retrieval
        - Skills and Lumo Hub
        - Contributing and development
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands, documentation followed, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Operating system:
        - Python version:
        - Node.js version:
        - Lumo commit or version:
