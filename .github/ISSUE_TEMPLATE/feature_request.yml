name: Feature request
description: Propose an improvement to Lumo
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this proposal.
          required: true
        - label: I am describing a user problem, not only a preferred implementation.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - Full local Lumo application
        - Public Lumo website or authenticated demo
        - Knowledge and retrieval
        - Research or tutoring
        - Books, notes, or creation
        - Agents or model providers
        - CLI, installation, or developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Learner or contributor problem
      description: Who has this problem, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result and how success could be evaluated.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation, interaction, API, or design ideas.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other approaches you considered.
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and compatibility considerations
      description: Describe new data, permissions, dependencies, migrations, or breaking changes.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, research, or related issues.
