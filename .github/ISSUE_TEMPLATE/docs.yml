name: Documentation issue
description: Report missing, inaccurate, unclear, or broken Lumo documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this documentation problem.
          required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the page or enter the repository path and heading.
      placeholder: README.md#run-the-full-application-locally
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of problem
      options:
        - Inaccurate or outdated information
        - Missing setup or usage guidance
        - Command or example does not work
        - Broken link
        - Public demo and local app are confused
        - Accessibility or readability
        - Typo or formatting
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: If possible, describe what the documentation should say instead.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, versions, or browser only when relevant.
